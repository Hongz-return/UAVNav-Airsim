# UE 5.4 TrainEnv_3D. Positions use local AirSim NED meters, workspace Z is up from PlayerStart.
[trainenv]
map_path = /Game/UAVTraining/Maps/TrainEnv_3D
editor_project = D:/software/Epic Games/UE/UE_5.4/Env/TrainEnvAirSim/TrainEnvAirSim.uproject
settings_template = ch4_trainenv_3d_airsim.json
spawn_position_ned = [0.0, 0.0, 0.0]

[options]
project_name = Ch4_TrainEnv_3D_MASAC
env_name = Obs
dynamic_name = Multirotor
navigation_3d = True
using_velocity_state = True
reward_type = reward_v2
perception = depth_state
algo = SAC
total_timesteps = 300000
policy_name = cnn
net_arch = [256, 128]
activation_function = relu
cnn_feature_num = 5
keyboard_debug = False
generate_q_map = False
state_feature_num = 6
use_mamba = True
print_airsim_log = False

[mamba]
n_stack = 1
seq_len = 16
inference_seq_len = 8
cnn_output_dim = 64
cnn_attention = coordatt
cnn_attention_reduction = 8
cnn_attention_stage = auto
mamba_hidden_dim = 128
mamba_d_state = 16
mamba_d_conv = 4
mamba_expand = 2
actor_hidden = [128, 64]
critic_hidden = [128, 128]
mamba_backend = auto
transformer_heads = 4
transformer_layers = 2
cnn_update_mode = both

[environment]
max_depth_meters = 25
screen_height = 60
screen_width = 90
crash_distance = 0
accept_radius = 2.0
accept_altitude_tolerance = 0.5
max_episode_steps = 500
start_position = [3.0, 0.0, -0.5]
start_random_angle = 0.245
align_start_yaw_to_goal = True
random_route_reverse = False
goal_position = [63.0, 0.0, -0.6]
distance_norm_scale = 200.0
max_vertical_difference = 6.4
# Equal numbers of entry-to-exit samples per family. The combined route is directional.
training_routes = [
    ([3.0, 0.0, -0.5], [63.0, 0.0, -0.6]),
    ([2.2, -0.6, -0.2], [61.2, 0.65, -0.9]),
    ([4.8, 0.75, -0.9], [64.6, -0.6, -0.35]),
    ([4.1, -0.25, -0.7], [62.3, 1.0, -1.0]),
    ([2.8, 0.4, -0.36], [60.4, -0.9, -0.8]),
    ([3.0, 12.0, -3.2], [63.0, 12.0, -3.0]),
    ([2.2, 11.4, -2.85], [61.2, 12.65, -3.35]),
    ([4.8, 12.75, -3.55], [64.6, 11.4, -2.55]),
    ([4.1, 11.75, -3.35], [62.3, 13.0, -2.8]),
    ([2.8, 12.4, -3.05], [60.4, 11.1, -3.15]),
    ([3.0, 24.0, -1.4], [63.0, 24.0, -1.4]),
    ([2.2, 23.4, -0.45], [61.2, 24.65, -0.45]),
    ([4.8, 24.75, -3.2], [64.6, 23.4, -3.2]),
    ([4.1, 23.75, -2.5], [62.3, 25.0, -2.5]),
    ([2.8, 24.4, -1.05], [60.4, 23.1, -1.05]),
    ([3.0, 36.0, -0.5], [64.0, 36.0, -0.8]),
    ([2.2, 35.4, -0.2], [61.2, 36.65, -0.4]),
    ([4.8, 36.75, -0.9], [64.6, 35.4, -1.1]),
    ([4.1, 35.75, -0.7], [62.3, 37.0, -0.6]),
    ([2.8, 36.4, -0.36], [60.4, 35.1, -0.95])
    ]
work_space_x = [-4.7, 71.7]
work_space_y = [-5.45, 41.45]
work_space_z = [-0.7, 4.7]

[multirotor]
dt = 0.1
action_repeat = 1
acc_xy_max = 2.0
v_xy_max = 4.0
v_xy_min = 0.5
v_z_max = 0.8
yaw_rate_max_deg = 60.0

[reward]
progress_mode = meters
progress_scale = 0.15
reward_reach = 35.0
reward_crash = -25.0
reward_outside = -20.0
reward_timeout = -10.0
obstacle_safe_margin = 2.5
obstacle_collision_margin = 0.4
obstacle_penalty_weight = 2.0
time_penalty = 0.015
action_smoothness_weight = 0.2
dense_reward_clip = 2.5
altitude_deviation_weight = 0.0
altitude_boundary_margin = 0.35
altitude_boundary_weight = 1.2

[perception]
virtual_ceiling_prob = 0.0

[airsim]
vehicle_name = SimpleFlight

[DRL]
gamma = 0.99
learning_rate = 3e-4
learning_starts = 2000
buffer_size = 100000
batch_size = 64
train_freq = 4
gradient_steps = 1
action_noise_sigma = 0.1
use_per = False
