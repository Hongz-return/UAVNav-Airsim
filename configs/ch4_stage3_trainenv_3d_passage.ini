# Follow-up on the same original multi-obstacle TrainEnv. Gates require measured physical passage.
# Stage 3 fine-tuning on the original multi-obstacle TrainEnv package.
# The held-out TrainEnv_3D course uses its own four-lane configuration.
[trainenv]
map_path = /Game/UAVTraining/Maps/TrainEnv
settings_template = ch4_stage3_trainenv_airsim.json
spawn_position_ned = [0.0, 0.0, 1.0]

[stage3]
course_file = ch4_stage3_trainenv_multiobstacle.json
original_altitude_weight = 0.35
altitude_tracking_weight = 0.44
side_tracking_weight = 0.105
strict_maneuvers = True
guided_fraction = 0.45

[options]
project_name = Ch4_Stage3_TrainEnv_3D_Passage_MASAC
env_name = Obs
dynamic_name = Multirotor
navigation_3d = True
using_velocity_state = True
reward_type = reward_v2
perception = depth_state
algo = SAC
total_timesteps = 24000
policy_name = cnn
net_arch = [256, 128]
activation_function = relu
cnn_feature_num = 5
keyboard_debug = False
generate_q_map = False
state_feature_num = 6
use_mamba = True
print_airsim_log = False

[mamba]
n_stack = 1
seq_len = 16
inference_seq_len = 8
cnn_output_dim = 64
cnn_attention = coordatt
cnn_attention_reduction = 8
cnn_attention_stage = auto
mamba_hidden_dim = 128
mamba_d_state = 16
mamba_d_conv = 4
mamba_expand = 2
actor_hidden = [128, 64]
critic_hidden = [128, 128]
mamba_backend = auto
transformer_heads = 4
transformer_layers = 2
cnn_update_mode = both

[environment]
max_depth_meters = 25
screen_height = 60
screen_width = 90
crash_distance = 0
accept_radius = 5.0
accept_altitude_tolerance = 0.5
max_episode_steps = 1000
start_position = [0.0, 0.0, 1.0]
start_random_angle = 0.45
align_start_yaw_to_goal = True
random_route_reverse = True
goal_position = [162.0, 0.0, 1.0]
distance_norm_scale = 200.0
max_vertical_difference = 2.0
training_routes = [
    ([0.0, -15.0, 1.0], [162.0, -15.0, 1.0]),
    ([0.0, -15.0, 1.0], [162.0, 0.0, 1.0]),
    ([0.0, -15.0, 1.0], [162.0, 15.0, 1.0]),
    ([0.0, 0.0, 1.0], [162.0, -15.0, 1.0]),
    ([0.0, 0.0, 1.0], [162.0, 0.0, 1.0]),
    ([0.0, 0.0, 1.0], [162.0, 15.0, 1.0]),
    ([0.0, 15.0, 1.0], [162.0, -15.0, 1.0]),
    ([0.0, 15.0, 1.0], [162.0, 0.0, 1.0]),
    ([0.0, 15.0, 1.0], [162.0, 15.0, 1.0])
    ]
work_space_x = [-7.0, 169.0]
work_space_y = [-58.0, 58.0]
work_space_z = [-2.2, 0.2]

[multirotor]
dt = 0.1
action_repeat = 1
acc_xy_max = 2.0
v_xy_max = 4.0
v_xy_min = 0.5
v_z_max = 0.8
yaw_rate_max_deg = 60.0

[reward]
progress_mode = meters
progress_scale = 0.15
reward_reach = 35.0
reward_crash = -25.0
reward_outside = -20.0
reward_timeout = -10.0
obstacle_safe_margin = 2.5
obstacle_collision_margin = 0.4
obstacle_penalty_weight = 2.0
time_penalty = 0.015
action_smoothness_weight = 0.2
dense_reward_clip = 2.5
altitude_deviation_weight = 0.0
altitude_boundary_margin = 0.35
altitude_boundary_weight = 1.2

[perception]
virtual_ceiling_prob = 0.75
virtual_ceiling_height_min = 1.5
virtual_ceiling_height_max = 3.0
virtual_ceiling_arch_drop_max = 0.6
virtual_ceiling_hfov_deg = 90.0
virtual_ceiling_aspect_ratio = 1.777778

[airsim]
vehicle_name = SimpleFlight
timeout_value = 30.0

[DRL]
gamma = 0.99
learning_rate = 4e-5
learning_starts = 1000
buffer_size = 18000
batch_size = 32
train_freq = 6
gradient_steps = 1
action_noise_sigma = 0.1
use_per = False
