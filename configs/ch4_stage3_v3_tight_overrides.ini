# Stage 3 v3 tight-goal overrides applied on top of the frozen Stage 2 best@495k contract.
[options]
project_name = Ch4_Stage3_V3_TightGoal_MASAC
total_timesteps = 100000

[environment]
accept_radius = 2.0
accept_altitude_tolerance = 0.5

[stage3_v2]
tight_goal = True
altitude_tracking_weight = 0.34
centerline_weight = 0.06
gate_bonus = 2.0
initial_alpha = 0.055
corridor_accept_radius = 1.6
corridor_altitude_tolerance = 0.40

[perception]
virtual_ceiling_prob = 0

[DRL]
learning_rate = 0.000055
buffer_size = 150000
fast_history = True
overlap_updates = True

[airsim]
ip = 127.0.0.1
depth_only = True
cache_step_state = True
timeout_value = 15
