[options]
project_name = TunnelActivate_LSTM
env_name = Obs
dynamic_name = Multirotor
navigation_3d = True
using_velocity_state = True
reward_type = reward_v2
perception = depth_state
algo = SAC
total_timesteps = 300000
policy_name = cnn
net_arch = [256, 128]
activation_function = relu
cnn_feature_num = 5
keyboard_debug = False
generate_q_map = False
state_feature_num = 6
use_mamba = True

[mamba]
n_stack = 1
seq_len = 16
inference_seq_len = 8
cnn_output_dim = 64
cnn_attention = none
cnn_attention_reduction = 8
cnn_attention_stage = auto
mamba_hidden_dim = 128
mamba_d_state = 16
mamba_d_conv = 4
mamba_expand = 2
actor_hidden = [128, 64]
critic_hidden = [128, 128]
mamba_backend = lstm
transformer_heads = 4
transformer_layers = 2
cnn_update_mode = both

[environment]
max_depth_meters = 25
screen_height = 60
screen_width = 90
crash_distance = 0
accept_radius = 5
max_episode_steps = 1000
start_position = [0, 0, -1.5]
start_random_angle = 0
goal_position = [201.3, 53.9, -1.8]
work_space_x = [-50, 250]
work_space_y = [-50, 100]
work_space_z = [-10, 10]

[multirotor]
dt = 0.1
action_repeat = 1
acc_xy_max = 2.0
v_xy_max = 4.0
v_xy_min = 0.5
v_z_max = 2.0
yaw_rate_max_deg = 60.0

[reward]
reward_reach = 35.0
reward_crash = -25.0
reward_outside = -20.0
reward_timeout = -10.0
obstacle_safe_margin = 2.5
obstacle_collision_margin = 0.4
progress_scale = 20.0
obstacle_penalty_weight = 2.0
time_penalty = 0.015
action_smoothness_weight = 0.2
dense_reward_clip = 2.5

[DRL]
gamma = 0.99
learning_rate = 3e-4
learning_starts = 2000
buffer_size = 50000
batch_size = 64
train_freq = 4
gradient_steps = 1
action_noise_sigma = 0.1
use_per = False
