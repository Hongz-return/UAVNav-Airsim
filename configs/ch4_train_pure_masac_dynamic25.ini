# Pure MA-SAC from scratch on the TrainEnv replica with 40 moving obstacle components.
# Keep policy, curriculum, observation, reward, and action settings from the static comparison.
[trainenv]
map_path = /Game/UAVTraining/Maps/TrainEnv_Dynamic25
editor_project = D:/software/Epic Games/UE/UE_5.4/Env/TrainEnvAirSim/TrainEnvAirSim.uproject
settings_template = ch4_stage3_trainenv_airsim.json
spawn_position_ned = [0.0, 0.0, 1.0]

[options]
project_name = Ch4_PureMASAC_Dynamic25_Scratch
env_name = Obs
dynamic_name = Multirotor
navigation_3d = True
using_velocity_state = True
reward_type = reward_v2
perception = depth_state
algo = SAC
total_timesteps = 500000
policy_name = cnn
net_arch = [256, 128]
activation_function = relu
cnn_feature_num = 5
keyboard_debug = False
generate_q_map = False
state_feature_num = 6
use_mamba = True
print_airsim_log = False

[mamba]
n_stack = 1
seq_len = 16
inference_seq_len = 8
cnn_output_dim = 64
cnn_attention = coordatt
cnn_attention_reduction = 8
cnn_attention_stage = auto
mamba_hidden_dim = 128
mamba_d_state = 16
mamba_d_conv = 4
mamba_expand = 2
actor_hidden = [128, 64]
critic_hidden = [128, 128]
mamba_backend = auto
transformer_heads = 4
transformer_layers = 2
cnn_update_mode = both

[environment]
max_depth_meters = 25
screen_height = 60
screen_width = 90
crash_distance = 0
accept_radius = 2.0
accept_altitude_tolerance = 0.5
max_episode_steps = 1000
start_position = [0.0, 0.0, 1.0]
start_random_angle = 0.45
align_start_yaw_to_goal = True
random_route_reverse = True
goal_position = [162.0, 0.0, 1.0]
distance_norm_scale = 200.0
max_vertical_difference = 2.0
training_routes = [
    ([0.0, -15.0, 1.0], [162.0, -15.0, 1.0]),
    ([0.0, -15.0, 1.0], [162.0, 0.0, 1.0]),
    ([0.0, -15.0, 1.0], [162.0, 15.0, 1.0]),
    ([0.0, 0.0, 1.0], [162.0, -15.0, 1.0]),
    ([0.0, 0.0, 1.0], [162.0, 0.0, 1.0]),
    ([0.0, 0.0, 1.0], [162.0, 15.0, 1.0]),
    ([0.0, 15.0, 1.0], [162.0, -15.0, 1.0]),
    ([0.0, 15.0, 1.0], [162.0, 0.0, 1.0]),
    ([0.0, 15.0, 1.0], [162.0, 15.0, 1.0])
    ]
work_space_x = [-7.0, 169.0]
work_space_y = [-58.0, 58.0]
work_space_z = [-2.2, 0.2]

[stage3_v2]
tight_goal = True
altitude_tracking_weight = 0.34
centerline_weight = 0.06
gate_bonus = 2.0
corridor_accept_radius = 1.6
corridor_altitude_tolerance = 0.40

[multirotor]
dt = 0.1
action_repeat = 1
acc_xy_max = 2.0
v_xy_max = 4.0
v_xy_min = 0.5
v_z_max = 0.8
yaw_rate_max_deg = 60.0

[reward]
progress_mode = meters
progress_scale = 0.15
reward_reach = 35.0
reward_crash = -25.0
reward_outside = -20.0
reward_timeout = -10.0
obstacle_safe_margin = 2.5
obstacle_collision_margin = 0.4
obstacle_penalty_weight = 2.0
time_penalty = 0.015
action_smoothness_weight = 0.2
dense_reward_clip = 2.5
altitude_deviation_weight = 0.35
altitude_boundary_margin = 0.35
altitude_boundary_weight = 1.2

[perception]
virtual_ceiling_prob = 0.0

[airsim]
ip = 127.0.0.1
vehicle_name = SimpleFlight
depth_only = True
cache_step_state = True
timeout_value = 30.0

[DRL]
gamma = 0.99
learning_rate = 3e-4
learning_starts = 2000
buffer_size = 150000
batch_size = 64
train_freq = 4
gradient_steps = 1
action_noise_sigma = 0.1
use_per = False
fast_history = True
overlap_updates = True
