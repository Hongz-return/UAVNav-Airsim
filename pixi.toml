[workspace]
name = "uav-navigation-drl-airsim"
channels = ["conda-forge"]
platforms = ["win-64"]

[system-requirements]
cuda = "12"

[dependencies]
python = "3.12.*"
pytorch-gpu = ">=2.7"
cuda-version = ">=12.8,<13"
numpy = ">=1.26,<3"
scipy = ">=1.13,<2"
matplotlib = ">=3.8"
tensorboard = ">=2.17"
pip = ">=24"
setuptools = "<81"

[pypi-dependencies]
gym-env = { path = ".", editable = true }
stable-baselines3 = "==2.8.0"
gymnasium = "==1.2.3"
cosysairsim = "==3.2.0"
mambapy = "==1.2.0"
opencv-python = ">=4.10"
pyyaml = ">=6"

[tasks]
check-gpu = "python -c \"import torch; assert torch.cuda.is_available(); print(torch.__version__, torch.version.cuda, torch.cuda.get_device_name(0))\""
tensorboard = "tensorboard --logdir Logs/TrainData/Runs"
